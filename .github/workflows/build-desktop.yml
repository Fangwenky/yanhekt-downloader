name: Build desktop apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS-arm64
          - os: windows-latest
            label: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt
      - name: FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Tests
        run: python -m unittest -v test_app.py test_library.py
      - name: Build native app
        run: python build_desktop.py
      - name: Check packaged macOS dependencies
        if: runner.os == 'macOS'
        run: |
          "dist/延河课堂.app/Contents/MacOS/YanhektDownloader" --smoke-test --state-dir build/smoke
          test -f build/smoke/smoke-ok.txt
          ditto -c -k --sequesterRsrc --keepParent "dist/延河课堂.app" dist/Yanhekt-macOS-arm64.zip
      - name: Check packaged Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/YanhektDownloader/YanhektDownloader.exe -ArgumentList '--smoke-test --state-dir build/smoke' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path build/smoke/smoke-ok.txt)) { throw 'Packaged browser/FFmpeg check failed' }
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile build/MicrosoftEdgeWebview2Setup.exe
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Yanhekt-${{ matrix.label }}
          path: |
            dist/Yanhekt-*.zip
            dist/Yanhekt-*-Setup.exe
          if-no-files-found: error
          retention-days: 30
